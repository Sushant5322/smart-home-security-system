<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart Home — Live Alerts</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#f5f7fb; color:#222; margin:18px; }
    header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    h1 { font-size:20px; margin:0; }
    .card { background:#fff; border-radius:10px; padding:12px; box-shadow:0 6px 18px rgba(20,30,60,0.06); }
    .layout { display:flex; gap:16px; align-items:flex-start; }
    #snapshot { width:360px; height:auto; border-radius:8px; border:1px solid #e6eef6; background:#ddd; }
    .meta { flex:1; display:flex; flex-direction:column; gap:8px; }
    .latest { display:flex; gap:12px; align-items:center; }
    .badge { background:#e6f7ff; color:#006494; padding:4px 8px; border-radius:8px; font-weight:600; }
    #events { max-height:400px; overflow:auto; margin-top:8px; }
    #events li { padding:8px; border-bottom:1px solid #f0f3f7; list-style:none; display:flex; justify-content:space-between; }
    small { color:#6b7280; }
    footer { margin-top:14px; font-size:13px; color:#666; }
  </style>
</head>
<body>
  <header>
    <h1>Smart Home Security — Live Alerts</h1>
    <div style="margin-left:auto">
      Status: <span id="conn-status" class="badge">Disconnected</span>
    </div>
  </header>

  <div class="card layout">
    <div>
      <h3 style="margin:0 0 8px 0">Latest Snapshot</h3>
      <img id="snapshot" src="/static/default_snapshot.png" alt="snapshot" />
    </div>

    <div class="meta">
      <div class="card latest">
        <div>
          <div style="font-size:18px"><strong id="detected-name">—</strong></div>
          <div><small id="detected-time">—</small></div>
        </div>
        <div style="margin-left:auto; text-align:right">
          <div class="badge" id="detected-confidence">—</div>
        </div>
      </div>

      <div class="card" style="padding:10px;">
        <h4 style="margin:0 0 8px 0">Event History</h4>
        <ul id="event-history"></ul>
      </div>
    </div>
  </div>

  <footer>
    Local server: <code>http://127.0.0.1:5000</code>. Make sure your recognizer posts to <code>/api/event</code>.
  </footer>

  <!-- Load Socket.IO client from server -->
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js" integrity="" crossorigin="anonymous"></script>


  <script>
    // connect
    const socket = io();

    socket.on('connect', () => {
      console.log("Connected to UI server");
      document.getElementById('conn-status').innerText = "Connected";
    });

    socket.on('disconnect', () => {
      console.log("Disconnected from UI server");
      document.getElementById('conn-status').innerText = "Disconnected";
    });

    socket.on('recognition_event', (data) => {
      console.log("Received event:", data);

      
      const snap = data.snapshot || '/static/default_snapshot.png';
      document.getElementById('snapshot').src = snap + '?t=' + Date.now();

      
      document.getElementById('detected-name').innerText = data.name || 'Unknown';
      document.getElementById('detected-time').innerText = data.timestr || '';
      document.getElementById('detected-confidence').innerText = (data.confidence||0).toFixed(1);

      
      const li = document.createElement('li');
      li.innerHTML = `<div>${data.timestr || ''} — <strong>${data.name || 'Unknown'}</strong></div><div>${(data.confidence||0).toFixed(1)}</div>`;
      const events = document.getElementById('event-history');
      events.prepend(li);
    });
  </script>
</body>
</html>
